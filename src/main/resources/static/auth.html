<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize</title>
    <link rel="stylesheet" href="css/auth_showcase.css">
</head>

<body>

    <div class="container">

        <div class="toggle">
            <button id="signupToggle" type="button">Signup</button>
            <button id="loginToggle" type="button">Login</button>
        </div>
        

        <div id="loginForm">
            <h1>Login</h1>
            <form>
                <label class="label1" for="usermail">Email: </label><br>
                <input type="email" name="usermail" id="usermail" placeholder="Enter your Email"><br><br>
                <label class="label2" for="password">Password: </label><br>
                <input type="password" name="password" id="password" placeholder="Enter your Password"><br><br>
                <a href="forgot.html" class="forgot">Forgot Password ?</a><br>
                <button id="loginBtn" type="button">Login</button>
            </form>
        </div>

        <div id="signupForm">
            <form>
                <h1>Signup</h1>
                <label class="label3" for="username">Name: </label><br>
                <input type="text" id="username" placeholder="Enter your Name"><br><br>
                <label class="label1" for="email">Email: </label><br>
                <input type="email" id="email" placeholder="Enter you Email"><br><br>
                <label class="label2" for="signupPassword">Password: </label><br>
                <input type="password" id="signupPassword" placeholder="Enter your Password"><br><br>
                <button id="signupBtn" type="button">Signup</button>
            </form>
        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
