<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login">
        <h1>Login</h1>
        <form>
            <label class="label1" for="usermail">Email: </label><br>
            <input type="email" name="usermail" id="usermail" placeholder="Enter your Email" ><br><br>
            <label class="label2" for="password">Password: </label><br>
            <input type="password" name="password" id="password" placeholder="Enter your Password"><br><br>
            <button id="loginBtn" type="button">Login Now</button>
        </form>
        <br><br>
        <div class="signup">
            <p>Account doesn't exist?</p>
            <a href="index.html">
                <button type="button">Create Now</button>
            </a>
            <br><br>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
