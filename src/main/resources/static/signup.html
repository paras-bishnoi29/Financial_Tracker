<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
    <div class="signup">
        <form>
            <h1>Signup</h1>
            <label class="label1" for="username">Name: </label><br>
            <input type="text" id="username" placeholder="Enter your Name"><br><br>
            <label class="label2" for="email">Email: </label><br>
            <input type="email" id="email" placeholder="Enter you Email"><br><br>
            <label class="label3" for="password">Password: </label><br>
            <input type="password" id="password" placeholder="Enter your Password"><br><br>
            <button id="signupBtn" type="button">Signup</button>
        </form>
        <br>
        <div class="login">
            <p>Account already exist?</p>
            <a href="login.html">
                <button>Login Now</button>
            </a>
            <br><br>
        </div>
        <script src="js/signup.js"></script>
    </div>


</body>

</html>
