<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker Dashboard</title>
    <link rel="stylesheet" href="css/dashboard_showcase.css">
</head>

<body>

    <nav class="topbar">
        <div class="logos">
            <img src="images/expenses.png" alt="Logo">
            <p>Finance Tracker</p>
        </div>
        <div class="links">
            <p id="userName">User</p>
            <!-- <a href="#" id="logoutBtn">Logout</a> -->
             <button type="button" id="salaryBtn">
                <img src="/images/money.png" alt="Salary Icon">
                <span>Manage Salary</span>
             </button>
            <button type="button" id="logoutBtn">
                <img src="/images/logout.png" alt="Logout Icon">
                <span>Logout</span>
            </button>
        </div>
    </nav>

    <br><br>

    <div class="cards">
        <div class="total">
            <h3>Total Expenses</h3>
            <p id="totalExpense">₹ 0</p>
        </div>
        <div class="transactions">
            <h3>Total Transactions</h3>
            <p id="totalTransactions">0</p>
        </div>
        <div class="highest">
            <h3>Highest Expense</h3>
            <p id="highestExpense">₹ 0</p>
        </div>
    </div>

    <br><br>

    <div class="expenses">
        <h2>Expenses:</h2>
        <br>

        <div class="expense-filter">
            <label for="expenseDate">View expenses:</label>

            <select id="expenseDate">
                <option value="">All Dates</option>
                <option value="custom">Select Date</option>
            </select>

            <input type="date" id="customDate" style="display: none;">
        </div>


        <div class="showExpense">
            <div>
                <table border="1" id="expenseTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">

                    </tbody>
                </table>

            </div>


            <div class="category-chart">
                <h2>Expense Distribution</h2>
                <canvas id="categoryChart"></canvas>
            </div>

        </div>

    </div>

    <br><br>

    <div class="add">
        <button id="addExpenseBtn" type="button">
            <img src="/images/add.png" alt="Add Icon">
            <span>Add an Expense</span>
        </button>
    </div>

    <dialog id="expenseDialog" class="expenseDialog">

        <h2>Add Expense</h2>

        <label>Name</label><br>
        <input type="text" id="name" placeholder="Enter the Expense Name">

        <br><br>

        <label>Amount</label><br>
        <input type="number" id="amount" placeholder="Enter the amount">

        <br><br>

        <label>Category</label><br>
        <select id="category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Others">Others</option>
        </select>

        <br><br>

        <button id="submitBtn">Add Expense</button>
        <button id="cancelBtn" type="button">Cancel</button>

    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
